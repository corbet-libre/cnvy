[package]
name = "cnvy"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Envoy: bounded authenticated community trust-feed follower"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://github.com/corbet-foss/cnvy"
publish = false

[features]
default = []
http = ["dep:reqwest"]
browser = ["dep:web-sys", "dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:wasm-streams", "dep:gloo-timers", "dep:futures-util"]

[dependencies]
cchr = { git = "https://github.com/corbet-foss/cchr", branch = "main" }
serde = { version = "1", features = ["derive"] }
schemars = "1"
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
wasm-streams = { version = "0.7", optional = true }
gloo-timers = { version = "0.4", features = ["futures"], optional = true }
futures-util = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window", "Request", "RequestInit", "RequestCredentials", "RequestRedirect", "RequestCache", "RequestMode", "ReferrerPolicy", "Headers", "Response", "ReadableStream", "AbortController", "AbortSignal"] }

[dev-dependencies]
csgn = { git = "https://github.com/corbet-foss/csgn", branch = "main", default-features = false, features = ["volatile-signer"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", features = ["crypto"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lints.rust]
unsafe_code = "forbid"
